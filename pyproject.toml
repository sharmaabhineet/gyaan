[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gyaan"
version = "0.1.0"
description = "Building AI-native systems from first principles"
requires-python = ">=3.11"

dependencies = [
    "openai>=2,<3",
]

[project.scripts]
gyaan = "gyaan.main:main"

[project.optional-dependencies]
dev = [
    "mypy",
    "pytest",
    "ruff",
]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true